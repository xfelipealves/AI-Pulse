<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C2B27"/>
      <stop offset="1" stop-color="#070B0A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.52" r="0.5">
      <stop offset="0" stop-color="#2EE6A6" stop-opacity="0.32"/>
      <stop offset="0.6" stop-color="#2EE6A6" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#2EE6A6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.55" stop-color="#34E39A"/>
      <stop offset="1" stop-color="#B4F25C"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7DF9C9"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- macOS icon grid: 824 px body centered in 1024 -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="url(#rim)" stroke-width="3"/>

  <!-- Usage gauge: 270° track with a 72% filled arc -->
  <g transform="translate(512 528)" fill="none" stroke-linecap="round">
    <path d="M -201.5 201.5 A 285 285 0 1 1 201.5 201.5" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="46"/>
    <path d="M -201.5 201.5 A 285 285 0 1 1 271.1 -88.1" stroke="url(#arc)" stroke-width="46" filter="url(#soft)" opacity="0.55"/>
    <path d="M -201.5 201.5 A 285 285 0 1 1 271.1 -88.1" stroke="url(#arc)" stroke-width="46"/>
  </g>

  <!-- Pulse line -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 300 560 H 392 L 444 426 L 520 662 L 572 498 L 606 560 H 724" stroke="#34E39A" stroke-width="54" filter="url(#soft)" opacity="0.6"/>
    <path d="M 300 560 H 392 L 444 426 L 520 662 L 572 498 L 606 560 H 724" stroke="url(#line)" stroke-width="44"/>
  </g>
</svg>
